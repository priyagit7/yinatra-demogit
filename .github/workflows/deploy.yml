name: Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t yinatra-testdemo .
      - name: Create artifact
        run: zip -r artifact.zip .
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::942049393866:role/github-actions-deployer
          aws-region: ap-south-1

      - name: Upload artifact to S3
        run: aws s3 cp artifact.zip s3://abaxys-deployss/artifacts/yinatra/
